name: Alpha checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Project, syntax and reachable-history checks
        run: python scripts/check_project.py --history
      - name: Build tooling
        run: python -m pip install build mypy
      - name: Static type checks
        run: python -m mypy --check-untyped-defs agentledger
      - name: Wheel and source archive
        run: python -m build
      - name: Install built wheel
        shell: bash
        run: python -m pip install --no-deps dist/*.whl
      - name: Installed entrypoint smoke
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          agentledger --version
          agentledger demo > demo.json
          agentledger verify
          agentledger report --format markdown
